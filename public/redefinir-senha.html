<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com; base-uri 'none'; form-action 'self'">
  <title>Redefinir senha | Academia Krypton</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&amp;family=Nunito+Sans:wght@300;400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="/css/conta.css">
  <script defer src="/js/contas.js"></script>
</head>
<body data-pagina="redefinir">
  <main class="card-login">
    <a class="brand" href="/"><img src="/logo.png" alt="">Academia Krypton</a>
    <h2>Redefinir senha</h2>
    <p class="mb-3">Escolha a nova senha da sua conta.</p>
    <p class="alert-msg" id="mensagem" role="status" hidden></p>
    <form method="post" id="redefinir">
      <div class="mb-3">
        <label class="form-label" for="novaSenha">Nova senha</label>
        <input class="form-control" id="novaSenha" name="novaSenha" type="password" autocomplete="new-password" aria-describedby="politica" required minlength="12">
        <div class="senha-opcoes">
          <span id="forca-texto">Força da senha</span>
          <button class="mostrar-senha" type="button" data-mostrar="novaSenha">Mostrar senha</button>
        </div>
        <meter id="forca" min="0" max="3" value="0" aria-labelledby="forca-texto"></meter>
        <p class="hint" id="politica">Use ao menos 12 caracteres, até 72 bytes em UTF-8. Uma frase longa ajuda a proteger a conta.</p>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirmacao">Confirmar nova senha</label>
        <input class="form-control" id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" required minlength="12">
      </div>
      <button class="btn-submit" type="submit">Salvar nova senha</button>
    </form>
    <p class="mt-3 mb-0"><a class="link-alt" id="voltar" href="/login.html">Voltar para entrar</a></p>
  </main>
</body>
</html>
