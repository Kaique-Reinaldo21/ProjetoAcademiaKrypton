<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do aluno | Academia Krypton</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/krypton-design-system.css" rel="stylesheet">
  <link href="/css/dashboard-aluno.css" rel="stylesheet">
  <script type="module" src="/js/dashboard/aluno.js"></script>
</head>
<body class="kd">
  <a class="kd-skip" href="#conteudo">Pular para o conteúdo</a>
  <div class="kd-shell">
    <div id="fundo-menu" class="kd-backdrop" hidden></div>
    <aside class="kd-sidebar" id="menu" aria-label="Área do aluno">
      <a class="kd-marca" href="#inicio">
        <img src="/logo.png" alt="" width="40" height="40">
        <span>ACADEMIA<strong>KRYPTON</strong></span>
      </a>
      <nav class="kd-nav" aria-label="Navegação principal">
        <a href="#inicio"><i class="bi bi-grid-1x2" aria-hidden="true"></i>Início</a>
        <p class="kd-nav-label">Minha rotina</p>
        <a href="#treinos"><i class="bi bi-lightning-charge" aria-hidden="true"></i>Treinos</a>
        <a href="#treinos-extras"><i class="bi bi-plus-square" aria-hidden="true"></i>Treinos extras</a>
        <a href="#progresso"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i>Meu progresso</a>
        <a href="#nutricao"><i class="bi bi-egg-fried" aria-hidden="true"></i>Nutrição</a>
        <a href="#agendamentos"><i class="bi bi-calendar3" aria-hidden="true"></i>Agendamentos</a>
        <p class="kd-nav-label">Minha conta</p>
        <a href="#faturas"><i class="bi bi-receipt" aria-hidden="true"></i>Faturas</a>
        <a href="#arquivos"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>Documentos</a>
        <a href="#configuracoes"><i class="bi bi-gear" aria-hidden="true"></i>Configurações</a>
      </nav>
      <button class="kd-button kd-sair" type="button" data-sair><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Encerrar sessão</button>
    </aside>
    <div class="kd-workspace">
      <header class="kd-header">
        <button class="kd-button kd-icon kd-hamburguer" id="abrir-menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu"><i class="bi bi-list" aria-hidden="true"></i></button>
        <p class="kd-local"><span>Área do aluno</span><i class="bi bi-chevron-right" aria-hidden="true"></i><strong id="secao-atual">Início</strong></p>
        <a class="kd-avatar aluno-avatar-cabecalho" data-avatar href="#configuracoes/foto" aria-label="Editar foto de perfil"><i class="bi bi-person" aria-hidden="true"></i></a>
        <a class="kd-conta" id="acesso-perfil" href="#configuracoes" aria-label="Configurações do perfil">

          <span class="kd-conta-nome" id="nome-cabecalho"></span>
          <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </a>
      </header>
      <main id="conteudo" class="kd-conteudo" tabindex="-1" aria-live="polite" aria-busy="true">
        <p class="kd-estado" role="status">Carregando painel…</p>
      </main>
    </div>
  </div>
</body>
</html>
